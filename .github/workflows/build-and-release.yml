name: Build and Release

on:
  push:
    # main too, so Codecov has a base report to compare pull requests against
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push to a pull request cancels its older run; pushes to main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build:
    name: build
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write     # dorny/test-reporter publishes the test results as a check run
      id-token: write   # Codecov upload via GitHub OIDC, no stored token

    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Windows Debugging Tools (cdb.exe)
      shell: pwsh
      run: |
        $cdb = Get-ChildItem `
          -Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" `
          -ErrorAction SilentlyContinue
        if ($cdb) {
          Write-Host "cdb.exe already present: $($cdb.FullName)"
        } else {
          Write-Host "Installing Windows Debugging Tools via choco..."
          choco install windbg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "choco install windbg failed with exit code $LASTEXITCODE"
          }
        }

        $debuggersDir = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
        if (Test-Path $debuggersDir) {
          echo $debuggersDir >> $env:GITHUB_PATH
          Write-Host "Added $debuggersDir to PATH"
        } else {
          Write-Warning "Debuggers directory not found after install"
        }

    # Not on tag builds: a release is built from a clean symbol cache, never from one a
    # pull request run could have written (cache poisoning).
    - name: Cache Microsoft Symbol Server downloads
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] skipped on tags, see the if above
      with:
        path: C:\Users\runneradmin\AppData\Local\CdbMcpServer\symbols
        key: symcache-${{ runner.os }}-${{ hashFiles('DumpAnalysisService.TestCrasher/**/*.cs') }}
        restore-keys: |
          symcache-${{ runner.os }}-

    - name: Get version from tag or branch
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
          $version = $matches[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version from tag: $version"
        } else {
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = "1.0.0-dev-$shortSha"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version from commit: $version"
        }

    - name: Restore dependencies
      run: dotnet restore DumpAnalyzer.slnx

    - name: Build solution  
      run: dotnet build DumpAnalyzer.slnx --no-restore --configuration $env:BUILD_CONFIGURATION

    - name: Run unit tests
      shell: pwsh
      run: |
        Write-Host "Running unit tests..." -ForegroundColor Cyan
        dotnet test DumpAnalyzer.slnx `
          --no-build `
          --configuration $env:BUILD_CONFIGURATION `
          --filter "Category!=Integration" `
          --verbosity normal `
          --logger trx `
          --logger "console;verbosity=detailed" `
          --results-directory TestResults `
          --collect:"XPlat Code Coverage" `
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run integration tests
      shell: pwsh
      run: |
        Write-Host "Running integration tests..." -ForegroundColor Cyan
        dotnet test DumpAnalysisService.IntegrationTests/DumpAnalysisService.IntegrationTests.csproj `
          --no-build `
          --configuration $env:BUILD_CONFIGURATION `
          --filter "Category=Integration" `
          --verbosity normal `
          --logger trx `
          --logger "console;verbosity=detailed" `
          --results-directory TestResults
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Generate test summary
      if: always()
      shell: pwsh
      run: |
        Write-Host "📊 Generating test summary..." -ForegroundColor Cyan

        # Count test results from TRX files
        $trxFiles = Get-ChildItem -Path "TestResults" -Filter "*.trx" -ErrorAction SilentlyContinue
        $totalTests = 0
        $passedTests = 0
        $failedTests = 0
        $skippedTests = 0

        foreach ($trxFile in $trxFiles) {
          try {
            # -LiteralPath: a second run in the same second is named "...[1].trx", which -Path reads as a wildcard
            [xml]$trx = Get-Content -LiteralPath $trxFile.FullName -Raw
            $counters = $trx.TestRun.ResultSummary.Counters
            if ($counters) {
              $totalTests += [int]$counters.total
              $passedTests += [int]$counters.passed
              $failedTests += [int]$counters.failed
              # Skipped tests are results with outcome NotExecuted; the TRX counters leave notExecuted at 0
              $skippedTests += @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'NotExecuted' }).Count
            }
          }
          catch {
            Write-Warning "Could not parse $($trxFile.Name): $($_.Exception.Message)"
          }
        }

        # Generate summary
        Write-Host "🎯 Test Summary:" -ForegroundColor Yellow
        Write-Host "  Total: $totalTests" -ForegroundColor White
        Write-Host "  ✅ Passed: $passedTests" -ForegroundColor Green
        Write-Host "  ❌ Failed: $failedTests" -ForegroundColor Red
        Write-Host "  ⏭️ Skipped: $skippedTests" -ForegroundColor Yellow

        # Set outputs for workflow summary
        echo "total-tests=$totalTests" >> $env:GITHUB_OUTPUT
        echo "passed-tests=$passedTests" >> $env:GITHUB_OUTPUT
        echo "failed-tests=$failedTests" >> $env:GITHUB_OUTPUT
        echo "skipped-tests=$skippedTests" >> $env:GITHUB_OUTPUT

        # Create workflow summary
        echo "## 🧪 Test Results" >> $env:GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $env:GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
        echo "| Total | $totalTests |" >> $env:GITHUB_STEP_SUMMARY
        echo "| ✅ Passed | $passedTests |" >> $env:GITHUB_STEP_SUMMARY
        echo "| ❌ Failed | $failedTests |" >> $env:GITHUB_STEP_SUMMARY
        echo "| ⏭️ Skipped | $skippedTests |" >> $env:GITHUB_STEP_SUMMARY

        if ($failedTests -gt 0) {
          echo "❌ **$failedTests test(s) failed!**" >> $env:GITHUB_STEP_SUMMARY
        } else {
          echo "✅ **All tests passed!**" >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Publish DumpAnalysisService
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        dotnet publish DumpAnalysisService/DumpAnalysisService.csproj `
          --configuration $env:BUILD_CONFIGURATION `
          --runtime win-x64 `
          --output publish/win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:Version=$env:VERSION

    - name: Publish CommandLineClient
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        dotnet publish CommandLineClient/CommandLineClient.csproj `
          --configuration $env:BUILD_CONFIGURATION `
          --runtime win-x64 `
          --output publish/win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:Version=$env:VERSION

    - name: Create portable package
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $version = $env:VERSION
        
        Write-Host "📦 Creating WinDbg MCP Server package v$version"
        
        # Create package directory
        New-Item -ItemType Directory -Path "package" -Force
        
        # Copy executables (with validation)
        if (Test-Path "publish/win-x64/*.exe") {
          Copy-Item "publish/win-x64/*.exe" "package/" -Force
          Write-Host "✅ Copied executables"
        } else {
          Write-Error "❌ No executables found in publish/win-x64/"
          exit 1
        }
        Copy-Item "publish/win-x64/*.pdb" "package/" -Force -ErrorAction SilentlyContinue
        # appsettings.json carries AllowedHosts=localhost (DNS-rebinding protection) and the Security defaults
        Copy-Item "publish/win-x64/appsettings.json" "package/" -Force -ErrorAction Stop
        
        # Copy scripts
        if (Test-Path "Scripts/") {
          Copy-Item "Scripts/" "package/Scripts/" -Recurse -Force
          Write-Host "✅ Copied Scripts folder"
        }
        
        # Copy documentation
        Copy-Item "README.md" "package/" -Force -ErrorAction Stop
        Copy-Item "LICENSE" "package/" -Force -ErrorAction Stop
        Copy-Item "NOTICE" "package/" -Force -ErrorAction Stop
        Copy-Item "CLAUDE.md" "package/" -Force -ErrorAction Stop
        
        # Copy configuration examples
        Copy-Item ".mcp.json" "package/" -Force -ErrorAction Stop
        if (Test-Path "Tests/") {
          Copy-Item "Tests/" "package/Examples/" -Recurse -Force
          Write-Host "✅ Copied Tests as Examples"
        }
        
        # Create version info file
        $versionContent = @"
        WinDbg MCP Server v$version
        Built on: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        Commit: $env:GITHUB_SHA

        Files included:
        - DumpAnalysisService.exe (MCP HTTP server + REST API)
        - CommandLineClient.exe (Command-line tool for scripting)
        - Scripts/ (PowerShell scripts for standalone usage)
        - README.md (Complete documentation)
        - CLAUDE.md (Claude Code integration instructions)
        - .mcp.json (MCP HTTP configuration example)
        - Examples/ (Usage examples)

        Quick start:
        1. Run DumpAnalysisService.exe to start the server (port 7997)
        2. Configure Claude Code with .mcp.json (HTTP transport)
        3. Use CommandLineClient.exe for scripting and Azure Functions
        4. Use Scripts/cdb.ps1 for standalone dump analysis

        For detailed instructions, see README.md
        "@
        $versionContent | Out-File -FilePath "package/VERSION.txt" -Encoding UTF8
        
        # Create ZIP package
        $packageName = "windbg-mcp-server-v$version-win-x64"
        Compress-Archive -Path "package/*" -DestinationPath "$packageName.zip" -Force
        
        Write-Host "✅ Created package: $packageName.zip"
        echo "package-name=$packageName" >> $env:GITHUB_OUTPUT
        echo "package-path=$packageName.zip" >> $env:GITHUB_OUTPUT
        
        # List package contents for verification
        Write-Host "📦 Package contents:"
        Get-ChildItem "package/" -Recurse | ForEach-Object { 
          $relativePath = $_.FullName.Replace((Resolve-Path "package/").Path, "")
          Write-Host "  $relativePath"
        }
        
        # Validate required files exist
        $requiredFiles = @("DumpAnalysisService.exe", "CommandLineClient.exe", "appsettings.json", "README.md", "CLAUDE.md", "LICENSE", "NOTICE")
        foreach ($file in $requiredFiles) {
          if (Test-Path "package/$file") {
            Write-Host "✅ Found required file: $file"
          } else {
            Write-Error "❌ Missing required file: $file"
            exit 1
          }
        }

    - name: Publish test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always()
      with:
        name: .NET Tests
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: test-results-${{ steps.version.outputs.version }}
        path: TestResults/
        retention-days: 30

    - name: Upload code coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always()
      with:
        directory: TestResults
        use_oidc: true
        fail_ci_if_error: false

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windbg-mcp-server-${{ steps.version.outputs.version }}
        path: |
          *.zip
          package/

    - name: Upload publish output for the Docker image
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: publish-win-x64-${{ steps.version.outputs.version }}
        path: publish/win-x64/
        retention-days: 1

  # docs/**/*.d2 are the architecture sources: each must be formatted, valid, and rendered to the
  # committed .svg next to it.
  diagrams:
    name: diagrams
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24'
        cache: false

    - name: Install D2
      # The SVG embeds the D2 build's version string, so install it the same way locally.
      run: |
        go install oss.terrastruct.com/d2@v0.7.2
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Check diagrams
      run: Scripts/render-diagrams.sh --check

  # The image is built on windows-2022: windows-latest has no running Docker engine, and the
  # servercore:ltsc2022 base image matches this host build. A failure here never blocks the
  # release ZIP, which the release job publishes from the build job alone.
  docker:
    name: docker
    needs: build
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download publish output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: publish-win-x64-${{ needs.build.outputs.version }}
        path: publish/win-x64

    # The hosted Windows images can start with the Docker engine down
    # (actions/runner-images#13729), which is what broke the v1.1.0 image build.
    - name: Start Docker engine
      shell: pwsh
      run: |
        Restart-Service docker -ErrorAction Stop
        for ($i = 0; $i -lt 30; $i++) {
          docker version *> $null
          if ($LASTEXITCODE -eq 0) { break }
          Start-Sleep -Seconds 2
        }
        docker version
        if ($LASTEXITCODE -ne 0) { throw "The Docker engine did not start" }

    - name: Login to GHCR
      shell: pwsh
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $env:GHCR_TOKEN | docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Docker image
      shell: pwsh
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        $version = $env:VERSION
        $image = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/mcp-windbg"
        docker build `
          -t "${image}:v$version" `
          -t "${image}:latest" `
          .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Push Docker image
      shell: pwsh
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        $version = $env:VERSION
        $image = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/mcp-windbg"
        docker push "${image}:v$version"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        docker push "${image}:latest"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the GitHub release and upload the ZIP

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: windbg-mcp-server-${{ needs.build.outputs.version }}

    - name: Create Release Body
      id: release_body
      shell: pwsh
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        $body = @"
        ## WinDbg MCP Server $env:VERSION

        Windows memory dump analysis tool with MCP (Model Context Protocol) HTTP integration.

        ### Features
        - Interactive debugging with persistent WinDbg/CDB sessions
        - 10 types of predefined analyses (basic, exception, threads, heap, etc.)
        - Claude Code integration via MCP HTTP protocol
        - REST API for PowerShell scripts and Azure Functions
        - Command-line client for scripting and automation
        - Automatic debugger detection (Windows SDK, WinDbg Store App)
        - Single-file executable deployment
        - Real-time progress updates via SignalR

        ### What's included
        - ``DumpAnalysisService.exe`` - MCP HTTP server + REST API (port 7997)
        - ``CommandLineClient.exe`` - Command-line tool for scripting
        - ``appsettings.json`` - Server configuration (debugger, symbols, security)
        - ``Scripts/`` - PowerShell scripts for standalone usage
        - ``README.md`` - Complete documentation and integration guide
        - ``.mcp.json`` - Configuration example for Claude Code (HTTP transport)
        - ``LICENSE``, ``NOTICE`` - Apache-2.0

        ### Docker
        ``docker pull ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant()):$env:GITHUB_REF_NAME`` (Windows container, ltsc2022)

        ### Quick Start
        1. Download and extract the ZIP file
        2. Run ``DumpAnalysisService.exe`` to start the MCP HTTP server (port 7997)
        3. Configure Claude Code with ``.mcp.json`` (uses HTTP transport at http://localhost:7997/mcp)
        4. Use ``CommandLineClient.exe`` for scripting, PowerShell, or Azure Functions integration
        5. See ``README.md`` for detailed integration instructions

        ### Requirements
        - Windows 10/11
        - .NET 10.0 runtime (included in single-file executable)
        - Windows SDK Debuggers (cdb.exe) or WinDbg from Microsoft Store

        For detailed documentation, see [README.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME/README.md).
        "@
        echo "body<<EOF" >> $env:GITHUB_OUTPUT
        echo $body >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: WinDbg MCP Server ${{ needs.build.outputs.version }}
        tag_name: ${{ github.ref_name }}
        body: ${{ steps.release_body.outputs.body }}
        # Appends "What's Changed" (the PRs merged since the previous release) and a compare link.
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: "*.zip"
        token: ${{ secrets.GITHUB_TOKEN }}