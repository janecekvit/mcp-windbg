name: Scorecard

# OpenSSF Scorecard: supply-chain checks, published to the public Scorecard API (README badge)
# and uploaded to code scanning. publish_results only accepts a plain workflow: no top-level
# env or defaults, and only approved actions in the job.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 2'   # weekly, Tuesday 05:41 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # read the workflow runs the checks look at
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish the results to the Scorecard API
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: results.sarif
